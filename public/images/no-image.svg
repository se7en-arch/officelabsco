<svg width="500" height="500" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="500" height="500" fill="#F8F8F8"/>

  <!-- Scattered plus signs -->
  <text x="52"  y="108" font-size="16" fill="#D0D0D0" font-family="sans-serif" font-weight="300">+</text>
  <text x="418" y="90"  font-size="16" fill="#D0D0D0" font-family="sans-serif" font-weight="300">+</text>
  <text x="62"  y="400" font-size="16" fill="#D0D0D0" font-family="sans-serif" font-weight="300">+</text>
  <text x="406" y="390" font-size="16" fill="#D0D0D0" font-family="sans-serif" font-weight="300">+</text>

  <!-- Scattered dots -->
  <circle cx="210" cy="72"  r="2.8" fill="#D4D4D4"/>
  <circle cx="368" cy="154" r="2.8" fill="#D4D4D4"/>
  <circle cx="96"  cy="268" r="2.8" fill="#D4D4D4"/>
  <circle cx="436" cy="280" r="2.8" fill="#D4D4D4"/>
  <circle cx="262" cy="440" r="2.8" fill="#D4D4D4"/>

  <!-- Back card — rotated gray -->
  <g transform="translate(250,215) rotate(-7) translate(-100,-130)">
    <rect width="200" height="260" rx="18" fill="#E2E2E2"/>
  </g>

  <!-- Front card shadow -->
  <rect x="148" y="88" width="204" height="258" rx="18" fill="rgba(0,0,0,0.07)" transform="translate(5,7)"/>

  <!-- Front card -->
  <rect x="148" y="88" width="204" height="258" rx="18" fill="#FFFFFF"/>

  <!-- Image placeholder icon — centred in front card -->
  <!-- card centre: x=250, y=217  icon: 120×96 -->
  <g transform="translate(190,162)">
    <rect x="0" y="0" width="120" height="96" rx="9" fill="none" stroke="#C8C8C8" stroke-width="2.5"/>
    <circle cx="34"  cy="28" r="12" fill="none" stroke="#C8C8C8" stroke-width="2.5"/>
    <polyline points="8,84 44,42 68,66 90,46 112,84" fill="none" stroke="#C8C8C8" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  </g>

  <!-- Shadow under front card -->
  <ellipse cx="250" cy="360" rx="76" ry="7" fill="rgba(0,0,0,0.06)"/>

  <!-- Text -->
  <text x="250" y="400" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#555555">Няма снимки</text>
  <text x="250" y="426" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" fill="#AAAAAA">Очаквайте галерията скоро</text>
</svg>
